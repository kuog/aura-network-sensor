[package]
name = "mcp-network-sensor"
version = "0.2.0"
edition = "2024"

[dependencies]
md5 = "0.7"
tls-parser = "0.12"
chrono = { version = "0.4.43", features = ["serde"] }
etherparse = "0.19.0"
lru = "0.16.3"
pcap = "2.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ctrlc = { version = "3.4", features = ["termination"] }

# Pipeline: high-performance inter-thread communication
crossbeam-channel = "0.5"

# Pipeline: CPU core pinning for dedicated threads
core_affinity = "0.8"

# Pipeline: async runtime for Stage 3 (Exporter)
tokio = { version = "1", features = ["full"] }

# Pipeline: SQLite persistence for alerts
rusqlite = { version = "0.34", features = ["bundled"] }

# Concurrent hash map for ARP Guardian state table
dashmap = "6"

# Logging (non-blocking)
log = "0.4"
env_logger = "0.11"

# Fast CIDR / IP-range matching for CDN context layer
ipnetwork = "0.20"

# libc bindings for reverse DNS (getnameinfo)
libc = "0.2"

# Async DNS resolver (hickory-resolver, successor to trust-dns)
hickory-resolver = "0.25"

# Colored terminal output for human-readable console alerts
colored = "3"

# Accurate terminal column-width for Unicode (emoji = 2 columns, etc.)
unicode-width = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Random number generation (for Isolation Forest)
rand = "0.8"

# Serialization for ML model persistence
bincode = "1"
