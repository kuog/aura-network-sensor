[package]
name = "mcp-network-sensor"
version = "0.2.0"
edition = "2024"
description = "Passive network detection sensor with MITRE ATT&CK alerts"
license = "MIT"
default-run = "mcp-network-sensor"

[dependencies]
md5 = "0.7"
tls-parser = "0.12"
chrono = { version = "0.4.43", features = ["serde"] }
etherparse = "0.19.0"
lru = "0.16.3"
pcap = "2.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ctrlc = { version = "3.4", features = ["termination"] }
clap = { version = "4.5", features = ["derive"] }

# Pipeline: high-performance inter-thread communication
crossbeam-channel = "0.5"

# Pipeline: CPU core pinning for dedicated threads
core_affinity = "0.8"

# Pipeline: async runtime for Stage 3 (Exporter)
tokio = { version = "1", features = ["full"] }

# Pipeline: SQLite persistence for alerts
rusqlite = { version = "0.34", features = ["bundled"] }

# Concurrent hash map for ARP Guardian state table
dashmap = "6"

# Logging (non-blocking)
log = "0.4"
env_logger = "0.11"

# Fast CIDR / IP-range matching for CDN context layer
ipnetwork = "0.20"

# libc bindings for reverse DNS (getnameinfo)
libc = "0.2"

# Async DNS resolver (hickory-resolver, successor to trust-dns)
hickory-resolver = "0.25"

# Colored terminal output for human-readable console alerts
colored = "3"

# Error handling
anyhow = "1"
thiserror = "2"

# Random number generation (for Isolation Forest)
rand = "0.8"

# Serialization for ML model persistence
bincode = "1"

[features]
# Linux-only eBPF sensing: process attribution, reverse-shell detection and
# in-kernel flow accounting. Building it needs clang, libelf and zlib.
ebpf = ["dep:libbpf-rs", "dep:libbpf-cargo", "dep:vmlinux"]

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = { version = "0.27", optional = true }

[build-dependencies]
libbpf-cargo = { version = "0.27", optional = true }
# Pre-generated vmlinux.h per architecture; CO-RE adapts it to the running kernel.
vmlinux = { git = "https://github.com/libbpf/vmlinux.h.git", rev = "c32912840154a82205530cd6d498b346ac73a6d1", optional = true }
